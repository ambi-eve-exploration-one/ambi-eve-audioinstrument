<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype 1</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="playlist.js" defer=""></script>
    <script src="main.js" defer=""></script>
  </head>
  <body>
    <div class="content">
      <div class="music-title">
        <p class="name">Song Name</p>
        <p class="artist">Artist Name</p>
      </div>
      <div class="play-pause">
        <img class="play" src="icons/icons8-play-30.png" />
      </div>
      <audio src="songs/Adrenaline.mp3" class="main-song"></audio>
      <div class="queue-panel">
        <h3>Queue:</h3>
        <ul class="playlist"></ul>
      </div>
    </div>
  </body>
  <body>
    <div class="shortcuts">
      <h1>Use your keys to play!</h1>
      <h2>Spacebar to play/pause</h2>
      <h2>Enter to skip</h2>
      <h2>R key to shuffle</h2>
    </div>
  </body>
</html>
